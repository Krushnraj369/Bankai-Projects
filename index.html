<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BankaiQA - Test Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              // Semantic Colors Mapped to CSS Variables
              background: 'var(--bg-main)',
              surface: 'var(--bg-card)',
              'surface-hover': 'var(--bg-card-hover)',
              heading: 'var(--text-main)',
              muted: 'var(--text-secondary)',
              border: 'var(--border-main)',
              
              primary: {
                50: 'var(--primary-50)',
                500: 'var(--primary-500)',
                600: 'var(--primary-600)',
                700: 'var(--primary-700)',
              },
              // Keep some specific colors for alerts/badges
              slate: {
                850: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Light Theme */
        --bg-main: #f8fafc;        /* slate-50 */
        --bg-card: #ffffff;        /* white */
        --bg-card-hover: #f1f5f9;  /* slate-100 */
        --text-main: #0f172a;      /* slate-900 */
        --text-secondary: #64748b; /* slate-500 */
        --border-main: #e2e8f0;    /* slate-200 */
        
        --primary-50: #f0f9ff;
        --primary-500: #0ea5e9;
        --primary-600: #0284c7;
        --primary-700: #0369a1;
      }

      /* Dark Theme */
      .dark {
        --bg-main: #0f172a;        /* slate-900 */
        --bg-card: #1e293b;        /* slate-800 */
        --bg-card-hover: #334155;  /* slate-700 */
        --text-main: #f8fafc;      /* slate-50 */
        --text-secondary: #94a3b8; /* slate-400 */
        --border-main: #334155;    /* slate-700 */
        
        --primary-50: #0c4a6e;
        --primary-500: #38bdf8;    /* sky-400 */
        --primary-600: #0ea5e9;    /* sky-500 */
        --primary-700: #0284c7;
      }

      /* Cosmic Theme (Deep Purple/Blue) */
      .cosmic {
        --bg-main: #0b0f19;        /* Very dark blue */
        --bg-card: #111827;        /* gray-900 */
        --bg-card-hover: #1f2937;  /* gray-800 */
        --text-main: #e2e8f0;      /* slate-200 */
        --text-secondary: #9ca3af; /* gray-400 */
        --border-main: #374151;    /* gray-700 */
        
        --primary-50: #2e1065;
        --primary-500: #a78bfa;    /* violet-400 */
        --primary-600: #8b5cf6;    /* violet-500 */
        --primary-700: #7c3aed;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-main); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary); 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
